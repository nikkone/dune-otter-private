############################################################################
# Otter USV 01 configuration file.                                         #
############################################################################

[Require basic.ini]

############################################################################
# General Parameters.                                                      #
############################################################################

[General]
Vehicle                                 = ntnu-otter-01

[Tuning.Autopilot]
Enabled                                 = Never
Entity Label                            = AutopilotTuning
DesiredMPS                              = 0
DesiredHeading                          = 0
SetActive                               = false

[Control.ASV.HeadingAndSpeed]
Enabled                                 = Never
[Control.ASV.HeadingAndSpeedForce]
Enabled                                 = Hardware,Simulation
Entity Label                            = Direction & Speed Controller
Debug Level                             = None
Maximum Thrust Actuation                = 1.0
Ramp Actuation Limit                    = 0.0
MPS Force PID Gains                     = 142.9, 9.16, 150.0
MPS Force Integral Limit                = 240
MPS Force Feedforward Gain              = 0.0
Yaw PID Gains                           = 45.0, 0.0, 0.0
Maximum Heading Error to Thrust         = 30.0
Share Saturation                        = false
Log PID Parcels                         = true

[Control.ASV.HeadingAndSpeedForceAngVel]
Enabled                                 = Never
Entity Label                            = Direction & Speed Controller
Debug Level                             = None
Maximum Thrust Actuation                = 1.0
Ramp Actuation Limit                    = 0.0
MPS Force PID Gains                     = 142.9, 9.16, 0.0
MPS Force Integral Limit                = 240
MPS Force Feedforward Gain              = 0.0
Yaw PID Gains                           = 45.0, 0.0, 0.0
Maximum Heading Error to Thrust         = 30.0
Share Saturation                        = false
Log PID Parcels                         = true
Yaw Rate PID Gains                      = 0.0, 0.0, 0.0
Yaw Rate Feedforward Gain               = 1.0
Yaw Rate Integral Limit                 = 240

# IMU simulator.
[Simulators.IMU]
Enabled                                 = Simulation
Entity Label                            = IMU
Measures Euler Angles                   = True

[Navigation.General.GPSNavigationOtter]
Enabled                                 = Always
Entity Label                            = Navigation
Entity Label - GPS                      = GPS
Entity Label - IMU                      = IMU
Entity Label - Yaw                      = IMU
GPS has IMU                             = true
GPS has Yaw                             = true

# GPS simulator.
[Simulators.GPS]
Enabled                                 = Simulation, StratoPi
Execution Frequency                     = 5
Entity Label                            = GPS
Number of Satellites                    = 9
HACC                                    = 2
HDOP                                    = 0.9
Activation Depth                        = 0.2
Report Ground Velocity                  = true
Report Yaw                              = false
#Initial Position                        = 63, 10
Initial Position                        = 63.33, 10.083333

